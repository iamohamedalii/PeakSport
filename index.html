<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peak Sport – Club Sportif ISETMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,800..900&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1a5c;--deep:#06103d;--blue:#1d4fd8;--sun:#ffc61a;--ice:#eaf1ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--deep);color:var(--ice);font-family:"Archivo Narrow","Arial Narrow",Arial,sans-serif;display:flex;justify-content:center;overflow-x:hidden;
background-image:linear-gradient(160deg,transparent 0 55%,rgba(29,79,216,.35) 55% 100%)}
.peaks{position:fixed;inset:auto 0 0 0;height:42vh;pointer-events:none;opacity:.5}
.peaks svg{width:100%;height:100%;display:block}
main{position:relative;width:100%;max-width:440px;padding:40px 22px 36px;text-align:center}
.logo{width:min(66vw,260px);aspect-ratio:1;border-radius:50%;display:block;margin:0 auto;box-shadow:0 0 0 6px var(--sun),0 0 0 12px var(--deep),0 24px 60px rgba(0,0,0,.5);animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(24px) scale(.94);opacity:0}to{transform:none;opacity:1}}
h1{font-family:"Archivo","Arial Black",Arial,sans-serif;font-weight:900;font-stretch:112%;font-size:clamp(2.4rem,11vw,3.2rem);line-height:.95;letter-spacing:-.01em;margin:34px 0 8px;color:#fff}
.sub{font-size:1.15rem;margin:0 0 6px;color:var(--sun);font-weight:700}
.desc{font-size:1.05rem;line-height:1.4;margin:0 auto 30px;max-width:30ch;color:#c5d3ff}
h2{font-family:"Archivo",Arial,sans-serif;font-weight:800;font-size:1.05rem;margin:0 0 14px;color:#fff}
.links{display:grid;gap:12px}
.btn{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:14px;text-decoration:none;font-family:"Archivo",Arial,sans-serif;font-weight:800;font-size:1.05rem;color:#fff;text-align:left;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.btn svg{width:26px;height:26px;flex:none;fill:currentColor}
.btn span{flex:1}
.btn small{display:block;font-family:"Archivo Narrow",Arial,sans-serif;font-weight:500;font-size:.9rem;opacity:.85}
.ig{background:linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)}
.fb{background:#1877f2}
.mail{background:var(--sun);color:var(--deep)}
footer{margin-top:34px;font-size:.9rem;color:#8fa4e8}
@media (prefers-reduced-motion:reduce){.logo{animation:none}.btn{transition:none}}
</style>
</head>
